<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#091b36" />
      <stop offset="100%" stop-color="#020612" />
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Cyber Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00f2fe" stroke-width="4" stroke-dasharray="16 8 32 8" opacity="0.6" filter="url(#glow)" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#4facfe" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />
  
  <!-- Outer Crosshairs -->
  <line x1="256" y1="56" x2="256" y2="86" stroke="#00f2fe" stroke-width="4" />
  <line x1="256" y1="426" x2="256" y2="456" stroke="#00f2fe" stroke-width="4" />
  <line x1="56" y1="256" x2="86" y2="256" stroke="#00f2fe" stroke-width="4" />
  <line x1="426" y1="256" x2="456" y2="256" stroke="#00f2fe" stroke-width="4" />

  <!-- Central Emblem: Stylized ATLAS "A" Pyramidal Core -->
  <g filter="url(#glow)">
    <!-- Outer Hexagon / Shield Frame -->
    <polygon points="256,120 370,186 370,326 256,392 142,326 142,186" fill="none" stroke="#00f2fe" stroke-width="6" stroke-linejoin="round" opacity="0.85" />
    
    <!-- Inner Stylized Delta / A -->
    <polygon points="256,150 330,300 290,300 275,270 237,270 222,300 182,300" fill="none" stroke="#00f2fe" stroke-width="8" stroke-linejoin="round" />
    <polygon points="256,190 270,240 242,240" fill="#00f2fe" />
    
    <!-- Tech Center Reactor Core -->
    <circle cx="256" cy="256" r="12" fill="#00f2fe" />
    <circle cx="256" cy="256" r="28" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.75" />
  </g>

  <!-- Corner Tech Accents -->
  <path d="M 80,120 L 80,80 L 120,80" fill="none" stroke="#00f2fe" stroke-width="4" opacity="0.7" />
  <path d="M 432,120 L 432,80 L 392,80" fill="none" stroke="#00f2fe" stroke-width="4" opacity="0.7" />
  <path d="M 80,392 L 80,432 L 120,432" fill="none" stroke="#00f2fe" stroke-width="4" opacity="0.7" />
  <path d="M 432,392 L 432,432 L 392,432" fill="none" stroke="#00f2fe" stroke-width="4" opacity="0.7" />

  <!-- Label -->
  <text x="256" y="360" text-anchor="middle" font-family="'Courier New', monospace, sans-serif" font-size="20" font-weight="900" fill="#00f2fe" letter-spacing="8" opacity="0.9">ATLAS CORE</text>
</svg>
